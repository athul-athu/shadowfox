    <script>
        // Player filtering functionality
        document.addEventListener('DOMContentLoaded', () => {
            const categoryButtons = document.querySelectorAll('.category-btn');
            
            categoryButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove active class from all buttons
                    categoryButtons.forEach(btn => {
                        btn.classList.remove('active', 'bg-red-700', 'text-blue-900');
                        btn.classList.add('bg-blue-900', 'text-white');
                    });
                    
                    // Add active class to clicked button
                    button.classList.remove('bg-blue-900', 'text-white');
                    button.classList.add('active', 'bg-red-700', 'text-blue-900');
                    
                    // Filter players
                    const category = button.getAttribute('data-category');
                    filterPlayers(category);
                });
            });
        });

        function filterPlayers(category) {
            const playerCards = document.querySelectorAll('.player-card');
            
            playerCards.forEach(card => {
                const playerCategory = card.getAttribute('data-category');
                if (category === 'all' || playerCategory === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
